name: offline_link_saver
description: Offline-first read-later app that saves links for offline reading
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0
  
  # Storage & Preferences
  shared_preferences: ^2.2.0
  
  # Sharing
  receive_sharing_intent: ^1.4.8
  share_plus: ^7.2.0
  
  # Network & Web
  http: ^1.1.0
  html: ^0.15.4
  webview_flutter: ^4.4.0
  connectivity_plus: ^5.0.0
  
  # Utilities
  uuid: ^4.2.0
  url_launcher: ^6.2.0
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  
  # Ads
  google_mobile_ads: ^5.1.0

  # Error tracking
  sentry_flutter: ^8.9.0

  # In-app purchases (for future monetization)
  in_app_purchase: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
