buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// NOTE: Do NOT use projectsEvaluated here — it triggers early evaluation
// of subprojects and breaks the Flutter Gradle plugin for transitive deps
// like package_info_plus. JVM targets are set in android/app/build.gradle instead.

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
